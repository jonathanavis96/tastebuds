services:
  tastebuds:
    build: .
    ports:
      # Host bind address is configurable via BIND_HOST (defaults to loopback-only,
      # 127.0.0.1). This app has no auth/TLS of its own — it relies entirely on
      # being unreachable from outside your LAN/Tailscale. To reach it from your
      # phone over Tailscale, set BIND_HOST to your Tailscale IP (100.x.x.x) in
      # .env — never set it to 0.0.0.0, which would expose it on every interface
      # (including any public one) with zero auth in front of it.
      - "${BIND_HOST:-127.0.0.1}:8094:8094"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Force the in-container listener to every interface, no matter what
      # HOST is set to in .env. HOST is a bare-Node-only knob (see .env.example);
      # env_file above forwards the whole .env into the container, so a HOST
      # set for bare-Node dev (e.g. 127.0.0.1) would otherwise reach the
      # container too and make the app bind to its own loopback — unreachable
      # via the BIND_HOST-published port even though the container looks
      # healthy. A key set in `environment` always wins over the same key
      # coming from `env_file`, so this stays 0.0.0.0 regardless of .env.
      - HOST=0.0.0.0
    extra_hosts:
      # lets the container reach the Ollama container published on the host (:11434)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8094/api/profiles"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
